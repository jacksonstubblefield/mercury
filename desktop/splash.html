<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline'" />
    <title>Mercury</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1115;
        color: #c9ccd3;
        font: 13px "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      img {
        width: 64px;
        height: 64px;
      }
      .bar {
        width: 120px;
        height: 2px;
        border-radius: 1px;
        background: #1f232b;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #ee343c;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <img src="../assets/icon/icon.png" alt="" />
    <div>Starting Mercury…</div>
    <div class="bar"></div>
  </body>
</html>
