# Push a tag like v0.2.0 (matching package.json's version) to build the Windows installer
# and attach it to a draft GitHub release. Publish the draft when it looks right.
# Running it by hand (Actions tab) just builds the installer as a downloadable artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm ci
      - run: npm ci --prefix frontend

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run release

      - uses: actions/upload-artifact@v4
        with:
          name: Mercury-Setup
          path: dist/Mercury-Setup-*.exe

      - name: Draft the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Mercury-Setup-*.exe --draft --title "Mercury $GITHUB_REF_NAME" --generate-notes
